<template id="aboutTpl">
 <h2>Buku kebun dalam telefon petani muda</h2>
 <p>Ramai petani kecil tidak menyimpan rekod bulanan. Hasil dijual, baja dibeli, upah dibayar, tetapi tiada catatan yang menunjukkan sama ada kebun benar-benar untung selepas enam bulan. TaniKira menggabungkan tiga perkara yang selama ini terpisah: pemantauan kesihatan pokok, perancangan pembelian bahan, dan lejar kos serta hasil yang mengira untung bersih setiap bulan.</p>
 <div class="trio">
  <div>__ICON_padi__<b>Sawah padi</b><p>Jadual kerja ikut hari selepas tabur, semakan karah, bena perang, tikus dan siput.</p></div>
  <div>__ICON_getah__<b>Kebun getah</b><p>Rekod sekerap, upah toreh, semakan akar putih dan kanser jalur toreh.</p></div>
  <div>__ICON_sawit__<b>Kelapa sawit</b><p>Rekod BTS, pusingan tuai, Ganoderma, ulat bungkus dan kekurangan nutrien.</p></div>
 </div>
 <h3>Cadangan perintis bersama Jabatan Pertanian</h3>
 <ol>
  <li>Perintis di satu negeri dengan 30 hingga 50 petani muda bagi setiap tanaman, dipilih bersama pejabat pertanian daerah.</li>
  <li>Petani merekod kos, hasil dan semakan kesihatan sekurang-kurangnya enam bulan. Rekod kewangan kekal peribadi kepada petani.</li>
  <li>Borang tinjauan keperluan dalam aplikasi mengumpul cabaran sebenar mengikut negeri, daerah dan tanaman untuk panel pegawai.</li>
  <li>Dapatan perintis digunakan untuk merancang latihan, bantuan input dan versi seterusnya yang meliputi sayur-sayuran, buah-buahan dan ternakan.</li>
 </ol>
 <h3>Cara mencuba</h3>
 <p>Tekan <b>Cuba data contoh</b> pada skrin utama untuk melihat tiga kebun contoh dengan enam bulan rekod. Aplikasi ini boleh ditambah ke skrin utama telefon seperti aplikasi biasa.</p>
 <p class="sign"><b>Ir. Ts. Dr. Muhammad Hafiz HASSAN</b><br>Pusat Pengajian Kejuruteraan Mekanik, Universiti Sains Malaysia<br>Prototaip untuk pembentangan kepada Jabatan Pertanian Malaysia. © 2026 Universiti Sains Malaysia.</p>

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uidGen(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(iso,n){var d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function diffDays(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);}
function mk(iso){return iso.slice(0,7);}
function mLabel(k){var p=k.split("-");return BULAN[+p[1]-1]+" "+p[0];}
function fdate(iso){var p=iso.split("-");return +p[2]+" "+BULAN[+p[1]-1]+" "+p[0];}
function rm(n){var neg=n<0;n=Math.abs(n||0);return (neg?"−":"")+"RM "+n.toLocaleString("ms-MY",{minimumFractionDigits:2,maximumFractionDigits:2});}
function rn(n){return (n<0?"−":"")+Math.abs(n||0).toLocaleString("ms-MY",{minimumFractionDigits:0,maximumFractionDigits:0});}
function num(v){var n=parseFloat(String(v).replace(/,/g,""));return isFinite(n)?n:0;}
function lastMonths(n){var out=[],d=new Date();d.setDate(1);for(var i=n-1;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"));}return out;}

function sums(filterFn){var by={};S.duit.forEach(function(r){if(!filterFn(r))return;var k=mk(r.tarikh);by[k]=by[k]||{h:0,k:0};if(r.jenis==="hasil")by[k].h+=r.amaun;else by[k].k+=r.amaun;});return by;}

/* ---------- tasks ---------- */
function periodKey(f){var d=new Date(),y=d.getFullYear(),m=d.getMonth();if(f==="bulan")return y+"-"+String(m+1).padStart(2,"0");if(f==="suku")return y+"-Q"+(Math.floor(m/3)+1);return y+"-H"+(m<6?1:2);}
function tasksFor(k){var t=todayISO(),out=[];(TUGAS[k.tanaman]||[]).forEach(function(x){
 if(k.tanaman==="padi"){if(!k.tarikh)return;var due=addDays(k.tarikh,x.h);var key=k.id+"|"+x.id+"|"+k.tarikh;var dd=diffDays(t,due);
  if(dd<=14&&dd>=-30)out.push({key:key,t:x.t,d:x.d,due:due,dd:dd,k:k,done:!!S.selesai[key]});}
 else{var p=periodKey(x.f);var key2=k.id+"|"+x.id+"|"+p;out.push({key:key2,t:x.t,d:x.d,per:x.f,k:k,done:!!S.selesai[key2]});}});
 return out;}
function allTasks(){var o=[];S.kebun.forEach(function(k){if(ui.k==="all"||ui.k===k.id)o=o.concat(tasksFor(k));});return o;}
function lastHealth(kid){var l=S.sihat.filter(function(h){return h.kebunId===kid;}).sort(function(a,b){return b.tarikh.localeCompare(a.tarikh)||b.at-a.at;});return l[0];}

function spark(vals,labels){var w=300,hgt=90,n=vals.length,px=function(i){return 14+i*(w-28)/(n-1);},py=function(v){return 10+(100-v)*(hgt-24)/100;};

 return '<svg viewBox="0 0 '+w+' '+hgt+'" width="100%" role="img" aria-label="Trend skor kesihatan: '+vals.join(", ")+'"><line x1="0" x2="'+w+'" y1="'+py(80)+'" y2="'+py(80)+'" stroke="var(--good)" stroke-dasharray="4 4" opacity=".6"/><line x1="0" x2="'+w+'" y1="'+py(50)+'" y2="'+py(50)+'" stroke="var(--bad)" stroke-dasharray="4 4" opacity=".5"/><path d="'+d+'" fill="none" stroke="var(--daun)" stroke-width="2.5"/>'+vals.map(function(v,i){return'<circle cx="'+px(i)+'" cy="'+py(v)+'" r="4" fill="'+hStatus(v)[2]+'"><title>'+labels[i]+": "+v+'</title></circle>';}).join("")+'</svg>';}

}

 else if(a==="editKebun")formKebun(b.dataset.id);

 else if(a==="demo"){S=demoData();save();ui.k="all";render();toast("Data contoh dimuatkan");}
